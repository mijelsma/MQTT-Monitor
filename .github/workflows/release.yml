name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

# Keep release publication ordered even when tags are pushed close together.
concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.41.4

jobs:
  release-context:
    runs-on: ubuntu-22.04
    outputs:
      channel: ${{ steps.channel.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: channel
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 scripts/desktop_release_contract.py --tag "$GITHUB_REF_NAME" --print channel)"
          echo "value=$channel" >> "$GITHUB_OUTPUT"

  windows:
    needs: release-context
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Windows release assets
        shell: bash
        run: bash scripts/publish_desktop_update.sh windows '${{ needs.release-context.outputs.channel }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-monitor-windows
          path: dist/github-release
          if-no-files-found: error

  macos:
    needs: release-context
    runs-on: macos-14
    env:
      MACOS_DEVELOPER_ID_APPLICATION: 'Developer ID Application: Michel Jelsma (T589Z25JDU)'
      MACOS_NOTARY_PROFILE: mqtt-monitor-notary
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/mqtt-monitor-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_path="$RUNNER_TEMP/mqtt-monitor-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo "MACOS_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$MACOS_NOTARY_API_KEY_P8_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          xcrun notarytool store-credentials "$MACOS_NOTARY_PROFILE" \
            --key "$notary_key_path" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --keychain "$keychain_path"
      - name: Build macOS release assets
        run: bash scripts/publish_desktop_update.sh macos '${{ needs.release-context.outputs.channel }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-monitor-macos
          path: dist/github-release
          if-no-files-found: error
      - name: Remove temporary macOS credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/mqtt-monitor-developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

  linux:
    needs: release-context
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libsecret-1-0 libsecret-1-dev ninja-build
      - name: Build Linux release assets
        run: bash scripts/publish_desktop_update.sh linux '${{ needs.release-context.outputs.channel }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-monitor-linux
          path: dist/github-release
          if-no-files-found: error

  github-release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mqtt-monitor-*
          path: release-assets
          merge-multiple: true
      - name: Assemble and validate update manifest
        run: >-
          python3 scripts/assemble_github_release.py
          --tag "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
          --assets release-assets
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo 'No release artifacts were produced.' >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; published releases are immutable." >&2
            exit 1
          fi
          flags=(--draft --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Verify published release assets
        shell: bash
        run: |
          set -euo pipefail
          verification_directory="$RUNNER_TEMP/published-release"
          mkdir -p "$verification_directory"
          gh release download "$GITHUB_REF_NAME" --dir "$verification_directory"
          cp "$verification_directory/app-archive.json" "$RUNNER_TEMP/published-app-archive.json"
          python3 scripts/assemble_github_release.py \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --assets "$verification_directory"
          cmp "$verification_directory/app-archive.json" "$RUNNER_TEMP/published-app-archive.json"
