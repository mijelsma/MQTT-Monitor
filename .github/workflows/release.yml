name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

# A release updates one shared app-archive.json. Never let two tags update it
# at the same time.
concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.41.4
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.value }}
    steps:
      - id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo 'value=beta' >> "$GITHUB_OUTPUT"
          else
            echo 'value=stable' >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: release-context
    runs-on: windows-latest
    env:
      UPDATE_BASE_URL: ${{ secrets.UPDATE_BASE_URL }}
      HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
      HETZNER_S3_PREFIX: ${{ secrets.HETZNER_S3_PREFIX }}
      HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
      HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.HETZNER_S3_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Publish Windows update
        shell: bash
        run: bash scripts/publish_desktop_update.sh windows '${{ needs.release-context.outputs.channel }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-monitor-windows
          path: dist/desktop_updater/releases

  macos:
    needs: [release-context, windows]
    runs-on: macos-latest
    env:
      UPDATE_BASE_URL: ${{ secrets.UPDATE_BASE_URL }}
      HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
      HETZNER_S3_PREFIX: ${{ secrets.HETZNER_S3_PREFIX }}
      HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
      HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.HETZNER_S3_REGION }}
      REQUIRE_EXISTING_ARCHIVE: 'true'
      MACOS_DEVELOPER_ID_APPLICATION: 'Developer ID Application: Michel Jelsma (T589Z25JDU)'
      MACOS_NOTARY_PROFILE: mqtt-monitor-notary
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AWS CLI
        run: python3 -m pip install --upgrade awscli
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/mqtt-monitor-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_path="$RUNNER_TEMP/mqtt-monitor-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo "MACOS_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$MACOS_NOTARY_API_KEY_P8_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          xcrun notarytool store-credentials "$MACOS_NOTARY_PROFILE" \
            --key "$notary_key_path" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --keychain "$keychain_path"
      - name: Publish macOS update
        run: bash scripts/publish_desktop_update.sh macos '${{ needs.release-context.outputs.channel }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-monitor-macos
          path: dist/desktop_updater/releases
      - name: Remove temporary macOS credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/mqtt-monitor-developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

  linux:
    needs: [release-context, macos]
    runs-on: ubuntu-latest
    env:
      UPDATE_BASE_URL: ${{ secrets.UPDATE_BASE_URL }}
      HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
      HETZNER_S3_PREFIX: ${{ secrets.HETZNER_S3_PREFIX }}
      HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
      HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.HETZNER_S3_REGION }}
      REQUIRE_EXISTING_ARCHIVE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AWS CLI
        run: python3 -m pip install --upgrade awscli
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev ninja-build
      - name: Publish Linux update
        run: bash scripts/publish_desktop_update.sh linux '${{ needs.release-context.outputs.channel }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mqtt-monitor-linux
          path: dist/desktop_updater/releases

  github-release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mqtt-monitor-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.pkg' -o -name '*.exe' \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo 'No release artifacts were produced.' >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            flags=(--generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}"
          fi
