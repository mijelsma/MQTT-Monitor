name: Build Desktop Apps

# Run on tags or manually.
on:
  push:
    tags: ["*"]
  workflow_dispatch: {}

env:
  FLUTTER_CHANNEL: "stable"
  FLUTTER_VERSION: "3.41.4"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # Windows x64 Build
  # ---------------------------------------------------------------------
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate git info
        run: python scripts/generate_git_info.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Zip build output
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath app-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-x64
          path: app-windows-x64.zip

  # ---------------------------------------------------------------------
  # Windows ARM64 Build
  # ---------------------------------------------------------------------
  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate git info
        run: python scripts/generate_git_info.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows ARM64
        run: flutter build windows --release

      - name: Zip build output
        run: |
          Compress-Archive -Path build\windows\arm64\runner\Release\* -DestinationPath app-windows-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-arm64
          path: app-windows-arm64.zip