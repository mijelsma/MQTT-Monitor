name: Desktop CI

on:
  push:
    branches: [main, improvement/refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.41.4

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libsecret-1-0 libsecret-1-dev ninja-build
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
          python3 -m unittest discover -s test/scripts -p 'test_*.py'

  desktop-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: macos
            runner: macos-14
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libsecret-1-0 libsecret-1-dev ninja-build
      - name: Build release bundle
        shell: bash
        run: flutter build '${{ matrix.platform }}' --release
