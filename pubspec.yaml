name: mqtt_monitor
description: "A desktop MQTT client for monitoring and publishing messages."

publish_to: 'none'

version: 0.2.0+6

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.5+1
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^10.3.1
  mqtt_client: ^10.11.9
  mqtt5_client: ^5.0.0
  file_picker: ^10.3.10
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  fl_chart: ^1.2.0
  flutter_markdown_plus: ^1.0.12
  http: ^1.6.0
  pub_semver: ^2.2.0
  url_launcher: ^6.3.2
  desktop_updater: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.7
  # Transitive deps of mqtt5_client used by the MQTT 5 fake in mqtt_service_test.
  event_bus: ^2.0.1
  typed_data: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png
